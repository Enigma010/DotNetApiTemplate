services:
  api:
    image: ${DOCKER_REGISTRY-}${App}api
    build:
      context: ..
      dockerfile: Api/Api/Dockerfile
      args:
        GITHUBCFG_USERNAME: ${GITHUBCFG_USERNAME}
        GITHUBCFG_PAT: ${GITHUBCFG_PAT}
        GITHUBCFG_NAMESPACE: ${GITHUBCFG_NAMESPACE}
    volumes: [../Output/Log:/log]
    environment:
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      EVENT_BUS_HOST: ${EVENT_BUS_HOST} 
      EVENT_BUS_USERNAME: ${EVENT_BUS_USERNAME}
      EVENT_BUS_PASSWORD: ${EVENT_BUS_PASSWORD}
    depends_on:
      - documentdb
    networks:
      - tmpltnetwork
    extra_hosts:
    - "host.docker.internal:host-gateway"
  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:latest
    container_name: ${DOCKER_REGISTRY-}${App}documentdb
    restart: unless-stopped
    ports:
      - "10260:10260"
    command:  ["--username", "$MONGO_USERNAME", "--password", "$MONGO_PASSWORD"]
    networks:
      - tmpltnetwork

networks:
  tmpltnetwork:  